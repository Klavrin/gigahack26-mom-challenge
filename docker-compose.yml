# Portable automation stack: docker compose up -d
# Old GPU backend only: docker compose --profile legacy-nvidia up -d --build
name: mom

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  api:
    profiles: [legacy-nvidia]
    build: ./api
    <<: *gpu
    ports:
      - "8000:8000"          # web app, reachable from the internal network
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}
      ASR_MODE: ${ASR_MODE:-segment}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      CORRECT_TRANSCRIPT: ${CORRECT_TRANSCRIPT:-0}
      KEEP_AUDIO: ${KEEP_AUDIO:-0}
      OFFLINE: ${OFFLINE:-0}
      OLLAMA_URL: ${QWEN_URL:-http://ollama:11434}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/mom}
      TZ: Europe/Chisinau
    volumes:
      - ./models/whisper:/models/whisper
      - ./data:/data
      - ./glossary:/glossary:ro
      - ./eval:/app/eval:ro
    depends_on: [ollama, n8n]
    restart: unless-stopped

  ollama:
    profiles: [legacy-nvidia]
    image: ollama/ollama:latest
    <<: *gpu
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    restart: unless-stopped

  # One-shot: imports the SMTP credential + routing workflow and activates it.
  n8n-init:
    image: n8nio/n8n:1.123.82
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:credentials --input=/import/credentials/mailpit-smtp.json &&
        n8n import:workflow --input=/import/workflows/mom-routing.json &&
        n8n update:workflow --id=momRouting000001 --active=true
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-key-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"          # no telemetry
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false" # no update checks
      N8N_TEMPLATES_ENABLED: "false"             # no template gallery fetches
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_PAYLOAD_SIZE_MAX: "8"
      EXECUTIONS_DATA_MAX_AGE: "24"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      DB_SQLITE_POOL_SIZE: "2"
      GENERIC_TIMEZONE: Europe/Chisinau
      TZ: Europe/Chisinau
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro

  n8n:
    image: n8nio/n8n:1.123.82
    environment: *n8n-env
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Local mail catcher = the "hospital mail server" for the demo.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:8025:8025"   # inbox UI
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

volumes:
  n8n_data:
