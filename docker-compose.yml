# On-premise MoM pipeline. Everything runs on one machine; nothing calls out.
# First run (online, once):   docker compose up -d --build && ./scripts/pull-models.sh
# Demo run (Wi-Fi off):       docker compose up -d
# With NVIDIA speech models:  docker compose --profile nemo up -d   (+ ASR_BACKEND / DIARIZATION_URL in .env)
name: mom

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  api:
    build: ./api
    <<: *gpu
    ports:
      - "8000:8000"          # web app, reachable from the internal network
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}
      ASR_MODE: ${ASR_MODE:-segment}
      ASR_BACKEND: ${ASR_BACKEND:-whisper}
      NEMOTRON_URL: ${NEMOTRON_URL:-http://nemo:8001}
      DIARIZATION_URL: ${DIARIZATION_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      CORRECT_TRANSCRIPT: ${CORRECT_TRANSCRIPT:-0}
      KEEP_AUDIO: ${KEEP_AUDIO:-0}
      OFFLINE: ${OFFLINE:-0}
      HF_HUB_OFFLINE: ${OFFLINE:-0}
      OLLAMA_URL: http://ollama:11434
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/mom
      TZ: Europe/Chisinau
    volumes:
      - ./models/whisper:/models/whisper
      - ./data:/data
      - ./glossary:/glossary:ro
      - ./eval:/app/eval:ro
    depends_on: [ollama, n8n]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    <<: *gpu
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    restart: unless-stopped

  # Nemotron 3.5 ASR + Sortformer diarization. Opt-in: docker compose --profile nemo up -d
  nemo:
    build: ./services/nemo-server
    profiles: [nemo]
    <<: *gpu
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      NEMO_LOAD: ${NEMO_LOAD:-asr,diar}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: ${OFFLINE:-0}         # 1 = load weights from disk only
      TRANSFORMERS_OFFLINE: ${OFFLINE:-0}
    volumes:
      - ./models/hf:/models/hf
    restart: unless-stopped

  # One-shot: imports the SMTP credential + routing workflow and activates it.
  n8n-init:
    image: n8nio/n8n:1.123.82
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:credentials --input=/import/credentials/mailpit-smtp.json &&
        n8n import:workflow --input=/import/workflows/mom-routing.json &&
        n8n update:workflow --id=momRouting000001 --active=true
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-key-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"          # no telemetry
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false" # no update checks
      N8N_TEMPLATES_ENABLED: "false"             # no template gallery fetches
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Chisinau
      TZ: Europe/Chisinau
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro

  n8n:
    image: n8nio/n8n:1.123.82
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local mail catcher = the "hospital mail server" for the demo.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # inbox UI
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

volumes:
  n8n_data:
