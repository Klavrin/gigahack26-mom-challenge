# Laptop stack: web app + job queue, n8n, Mailpit. No models run here.
# ASR and LLM run on the GPU node (docker-compose.gpu.yml) on the hospital LAN,
# or are replaced by canned fixtures with MOCK_MODELS=1 (the default).
#   docker compose up -d --build
name: mom

services:
  api:
    build:
      context: ./api
      args:
        BASE_IMAGE: python:3.12-slim   # no CUDA needed on the laptop
    ports:
      - "8000:8000"          # web app, reachable from the internal network
    environment:
      MOCK_MODELS: ${MOCK_MODELS:-1}
      ASR_URL: ${ASR_URL:-}
      ASR_MODE: ${ASR_MODE:-segment}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      CORRECT_TRANSCRIPT: ${CORRECT_TRANSCRIPT:-0}
      KEEP_AUDIO: ${KEEP_AUDIO:-0}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      # Only used if ASR_URL is empty and mock is off (slow CPU fallback).
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      OFFLINE: ${OFFLINE:-0}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/mom
      TZ: Europe/Chisinau
    volumes:
      - ./data:/data
      - ./glossary:/glossary:ro
      - ./eval:/app/eval:ro
    depends_on: [n8n]
    restart: unless-stopped

  # One-shot: imports the SMTP credential + routing workflow and activates it.
  n8n-init:
    image: n8nio/n8n:1.123.82
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        n8n import:credentials --input=/import/credentials/mailpit-smtp.json &&
        n8n import:workflow --input=/import/workflows/mom-routing.json &&
        n8n update:workflow --id=momRouting000001 --active=true
    environment: &n8n-env
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-key-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"          # no telemetry
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false" # no update checks
      N8N_TEMPLATES_ENABLED: "false"             # no template gallery fetches
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Europe/Chisinau
      TZ: Europe/Chisinau
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/import:ro

  n8n:
    image: n8nio/n8n:1.123.82
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local mail catcher = the "hospital mail server" for the demo.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # inbox UI
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

volumes:
  n8n_data:
