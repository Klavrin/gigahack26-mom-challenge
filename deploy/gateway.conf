# Reverse proxy from the host into the sealed network. No internet upstreams.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

client_max_body_size 2g;          # long meeting recordings
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;       # websockets (mailpit live inbox, n8n editor)
proxy_set_header Connection $connection_upgrade;

server { listen 8000; location / { proxy_pass http://api:8000; } }
server { listen 8025; location / { proxy_pass http://mailpit:8025; } }
server { listen 5678; location / { proxy_pass http://n8n:5678; } }
