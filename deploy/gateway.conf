# Reverse proxy from the host into the sealed network. No internet upstreams.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

client_max_body_size 2g;          # long meeting recordings
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_http_version 1.1;
proxy_set_header Host $http_host;              # keep the port: n8n checks it against the Origin
proxy_set_header Upgrade $http_upgrade;       # websockets (mailpit live inbox, n8n editor)
proxy_set_header Connection $connection_upgrade;

# Docker's internal DNS, looked up again every 10 s: a rebuilt or restarted container gets a
# new address, and a name resolved only at startup would give 502 until the gateway restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server { listen 8000; set $up api:8000;     location / { proxy_pass http://$up; } }
server { listen 8025; set $up mailpit:8025; location / { proxy_pass http://$up; } }
server { listen 5678; set $up n8n:5678;     location / { proxy_pass http://$up; } }
